# Runs the end-to-end test (two browsers with fake cameras) on every push and pull request.
name: Test the booth

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the tests
        run: npm test
      - name: Keep screenshots and the sample video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/test-output/
          retention-days: 7
